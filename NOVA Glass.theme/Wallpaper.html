<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NOVA Glass</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(155deg,#a7d9f5 0%,#7bb7e5 38%,#536f9c 70%,#26344f 100%);animation:daynight 24s linear infinite}
.sunlight{position:absolute;top:-25%;left:-30%;width:120%;height:70%;background:radial-gradient(ellipse at 55% 45%,rgba(255,250,210,.92),rgba(255,226,157,.48) 28%,rgba(255,255,255,0) 68%);filter:blur(12px);animation:glow 24s linear infinite}
.horizon{position:absolute;bottom:-8%;left:-15%;width:130%;height:55%;background:linear-gradient(150deg,rgba(255,255,255,.3),rgba(37,64,99,.35)),linear-gradient(180deg,#789ab8,#344a68);border-radius:50% 50% 0 0;filter:blur(2px)}
.glass{position:absolute;inset:8% 7%;border:1px solid rgba(255,255,255,.42);border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.035));box-shadow:inset 0 1px 1px rgba(255,255,255,.38),0 18px 60px rgba(12,24,45,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 35%,rgba(255,255,255,.04) 65%,transparent);pointer-events:none}
.snow{position:absolute;inset:0;opacity:0;animation:snowtime 24s linear infinite}
.flake{position:absolute;top:-10%;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 7px rgba(255,255,255,.8);animation:fall 8s linear infinite}
.flake:nth-child(1){left:8%;animation-delay:-2s}.flake:nth-child(2){left:19%;animation-delay:-5s;animation-duration:10s}.flake:nth-child(3){left:33%;animation-delay:-1s;animation-duration:7s}.flake:nth-child(4){left:47%;animation-delay:-6s;animation-duration:11s}.flake:nth-child(5){left:61%;animation-delay:-3s;animation-duration:9s}.flake:nth-child(6){left:76%;animation-delay:-7s;animation-duration:12s}.flake:nth-child(7){left:89%;animation-delay:-4s;animation-duration:8s}
@keyframes fall{to{transform:translate3d(35px,115vh,0)}}
@keyframes glow{0%,29%{opacity:1}38%,100%{opacity:0}}
@keyframes snowtime{0%,35%{opacity:0}45%,95%{opacity:.9}100%{opacity:0}}
@keyframes daynight{0%,30%{filter:brightness(1.12)}45%,95%{filter:brightness(.58) hue-rotate(12deg)}100%{filter:brightness(1.12)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<div class="scene">
<div class="sunlight"></div><div class="horizon"></div><div class="glass"></div>
<div class="snow" aria-hidden="true"><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i><i class="flake"></i></div>
</div>
<script>
(function(){
  var start=Date.now();
  function sync(){
    var h=(new Date()).getHours();
    var day=h>=7&&h<14;
    document.querySelector('.sunlight').style.opacity=day?'1':'0';
    document.querySelector('.snow').style.opacity=day?'0':'.9';
  }
  sync();setInterval(sync,60000);
})();
</script>
</body>
</html>
