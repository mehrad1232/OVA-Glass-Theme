name: Legacy NOVA Glass Weather Tweak Build (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
      - name: Build rootful package
        working-directory: NOVAWeather
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Weather-iOS12-deb
          path: NOVAWeather/packages/*.deb
