name: Build NOVA Glass Atmosphere for iOS 12

on:
  push:
    branches: [main]
    paths:
      - "XenHTML/NOVA-Atmosphere/**"
      - "NOVAAtmosphere/**"
      - ".github/workflows/build-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atmosphere:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate transparent Home Screen and Lock Screen widget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = {
              "Wallpaper.html": Path("XenHTML/NOVA-Atmosphere/Wallpaper.html"),
              "LockBackground.html": Path("XenHTML/NOVA-Atmosphere/LockBackground.html"),
              "index.html": Path("XenHTML/NOVA-Atmosphere/index.html"),
          }
          for name, path in files.items():
              assert path.is_file(), f"missing {name}"
              source = path.read_text(encoding="utf-8")
              for token in ["nova-atmosphere", "nova-fx-canvas", "drawSnow", "drawRain",
                            "drawLeaves", "nova-sun-glow", "pointer-events:none",
                            "requestAnimationFrame", "background:transparent"]:
                  assert token in source, f"{name}: missing {token}"
              assert "</html>" in source.lower()
          assert files["Wallpaper.html"].read_bytes() == files["LockBackground.html"].read_bytes()
          assert files["Wallpaper.html"].read_bytes() == files["index.html"].read_bytes()
          control = Path("NOVAAtmosphere/control").read_text(encoding="utf-8")
          assert "Package: com.nova.glass.atmosphere" in control
          assert "Version: 2.1.0" in control
          print("PASS: transparent four-effect widget for Home Screen, Lock Screen and Xen HTML 2.")
          PY

      - name: Build rootful iOS DEB and ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zip
          mkdir -p dist
          STAGE="$RUNNER_TEMP/nova-atmosphere"
          mkdir -p "$STAGE/DEBIAN"
          mkdir -p "$STAGE/var/mobile/Library/SBHTML/NOVA-Glass-Atmosphere"
          mkdir -p "$STAGE/var/mobile/Library/LockHTML/NOVA-Glass-Atmosphere"
          mkdir -p "$STAGE/var/mobile/Library/Widgets/Universal/NOVA-Glass-Atmosphere"
          cp NOVAAtmosphere/control "$STAGE/DEBIAN/control"
          cp XenHTML/NOVA-Atmosphere/Wallpaper.html "$STAGE/var/mobile/Library/SBHTML/NOVA-Glass-Atmosphere/Wallpaper.html"
          cp XenHTML/NOVA-Atmosphere/LockBackground.html "$STAGE/var/mobile/Library/LockHTML/NOVA-Glass-Atmosphere/LockBackground.html"
          cp XenHTML/NOVA-Atmosphere/index.html "$STAGE/var/mobile/Library/Widgets/Universal/NOVA-Glass-Atmosphere/index.html"
          chmod 644 "$STAGE/DEBIAN/control"
          find "$STAGE/var" -type d -exec chmod 755 {} \;
          find "$STAGE/var" -type f -exec chmod 644 {} \;
          dpkg-deb --root-owner-group --build "$STAGE" "dist/com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb"
          test "$(dpkg-deb -f dist/com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb Package)" = "com.nova.glass.atmosphere"
          test "$(dpkg-deb -f dist/com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb Version)" = "2.1.0"
          test "$(dpkg-deb -f dist/com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb Architecture)" = "iphoneos-arm"
          dpkg-deb -c dist/com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb
          cp -R XenHTML/NOVA-Atmosphere dist/NOVA-Glass-Atmosphere-iOS12
          cp NOVAAtmosphere/README.md dist/NOVA-Glass-Atmosphere-iOS12/INSTALL.txt
          cp NOVAAtmosphere/control dist/NOVA-Glass-Atmosphere-iOS12/control
          cd dist
          zip -qr NOVA-Glass-Atmosphere-iOS12.zip NOVA-Glass-Atmosphere-iOS12
          sha256sum com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb > NOVA-Glass-Atmosphere-iOS12.sha256
          ls -lh com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb NOVA-Glass-Atmosphere-iOS12.zip

      - name: Upload atmosphere package
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Atmosphere-iOS12
          path: |
            dist/com.nova.glass.atmosphere_2.1.0_iphoneos-arm.deb
            dist/NOVA-Glass-Atmosphere-iOS12.zip
            dist/NOVA-Glass-Atmosphere-iOS12.sha256
          if-no-files-found: error
          retention-days: 30
