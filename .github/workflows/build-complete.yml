name: Build NOVA Glass for Messages 3 (iOS 12)

on:
  push:
    branches: [main]
    paths:
      - "NOVAWeather/**"
      - ".github/workflows/build-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messages-only:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Validate Messages-only filter and visual implementation
        working-directory: NOVAWeather
        run: |
          plutil -lint NOVAWeather.plist
          python3 - <<'PY'
          import plistlib
          with open("NOVAWeather.plist", "rb") as f:
              data = plistlib.load(f)
          assert data["Filter"]["Bundles"] == ["com.apple.MobileSMS"]
          source = open("Tweak.xm", encoding="utf-8").read()
          for token in ["UIVisualEffectView", "UIBlurEffect", "CAEmitterLayer",
                        "CKMessageEntryView", "BalloonView", "CKConversationListCell"]:
              assert token in source, "missing implementation: " + token
          for key in ["messages.enabled", "messages.bubbles", "messages.composer",
                      "messages.list", "messages.snow", "messages.iceBlue"]:
              assert key in source, "missing preference: " + key
          assert "SpringBoard" not in source
          control = open("control", encoding="utf-8").read()
          assert "Version: 3.0.0" in control
          print("PASS: MobileSMS-only filter, glass surfaces, atmosphere and preferences.")
          PY

      - name: Compile and package arm64 rootful iOS 12 tweak
        working-directory: NOVAWeather
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean
          make package FINALPACKAGE=1
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.nova.glass.weather"
          test "$(dpkg-deb -f "$DEB" Version)" = "3.0.0"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          dpkg-deb -c "$DEB" | grep -F "Library/PreferenceBundles/NOVAWeatherPrefs.bundle/"
          dpkg-deb -c "$DEB" | grep -F "Library/MobileSubstrate/DynamicLibraries/NOVAWeather.dylib"
          mkdir -p ../dist/NOVA-Glass-Messages-iOS12
          cp "$DEB" ../dist/NOVA-Glass-Messages-iOS12/
          cp README.md ../dist/NOVA-Glass-Messages-iOS12/
          cat > ../dist/NOVA-Glass-Messages-iOS12/INSTALL.txt <<'EOF'
          NOVA GLASS FOR MESSAGES 3.0.0
          Target: iPhone 5s / iOS 12.5.8 / rootful jailbreak (Amethyst)

          Install the .deb with Sileo. Then force-close and reopen Messages.
          Configure switches in Settings > NOVA Messages.
          The tweak injects only into com.apple.MobileSMS.
          It uses iOS 12 UIKit blur, glass tint, ChatKit view matching and optional snowfall.
          ChatKit is private; the exact view hierarchy must be verified on the target device.
          To disable, turn off Enable NOVA Glass or uninstall the package from Sileo.
          EOF
          cd ../dist
          zip -r NOVA-Glass-Messages-iOS12.zip NOVA-Glass-Messages-iOS12
          shasum -a 256 NOVA-Glass-Messages-iOS12.zip > NOVA-Glass-Messages-iOS12.sha256

      - name: Upload Messages-only package
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Messages-iOS12-v3
          path: |
            dist/NOVA-Glass-Messages-iOS12.zip
            dist/NOVA-Glass-Messages-iOS12.sha256
          if-no-files-found: error
          retention-days: 30
