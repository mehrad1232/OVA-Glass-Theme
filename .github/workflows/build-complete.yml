name: Build NOVA Glass Complete Edition (iOS 12)

on:
  push:
    branches: [main]
    paths:
      - "NOVAWeather/**"
      - "tools/**"
      - "XenHTML/**"
      - ".github/workflows/build-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messages-only:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install package and artwork tools
        run: |
          brew install ldid dpkg ffmpeg
          python3 -m pip install --break-system-packages Pillow numpy

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Validate Messages-only filter and visual implementation
        working-directory: NOVAWeather
        run: |
          plutil -lint NOVAWeather.plist
          python3 - <<'PY'
          import plistlib
          with open("NOVAWeather.plist", "rb") as f:
              data = plistlib.load(f)
          assert data["Filter"]["Bundles"] == ["com.apple.MobileSMS"]
          source = open("Tweak.xm", encoding="utf-8").read()
          for token in ["UIVisualEffectView", "UIBlurEffect", "CAEmitterLayer",
                        "CKMessageEntryView", "BalloonView", "CKConversationListCell"]:
              assert token in source, "missing implementation: " + token
          for key in ["messages.enabled", "messages.bubbles", "messages.composer",
                      "messages.list", "messages.snow", "messages.rain", "messages.iceBlue"]:
              assert key in source, "missing preference: " + key
          assert "SpringBoard" not in source
          control = open("control", encoding="utf-8").read()
          assert "Version: 3.1.0" in control
          print("PASS: MobileSMS-only filter, glass surfaces, atmosphere and preferences.")
          PY

      - name: Compile and package arm64 rootful iOS 12 tweak
        working-directory: NOVAWeather
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean
          make package FINALPACKAGE=1
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.nova.glass.weather"
          test "$(dpkg-deb -f "$DEB" Version)" = "3.1.0"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          dpkg-deb -c "$DEB" | grep -F "Library/PreferenceBundles/NOVAWeatherPrefs.bundle/"
          dpkg-deb -c "$DEB" | grep -F "Library/MobileSubstrate/DynamicLibraries/NOVAWeather.dylib"
          mkdir -p ../dist/NOVA-Glass-Messages-iOS12
          cp "$DEB" ../dist/NOVA-Glass-Messages-iOS12/
          cp README.md ../dist/NOVA-Glass-Messages-iOS12/
          cat > ../dist/NOVA-Glass-Messages-iOS12/INSTALL.txt <<'EOF'
          NOVA GLASS FOR MESSAGES 3.1.0
          Target: iPhone 5s / iOS 12.5.8 / rootful jailbreak (Amethyst)

          Install the .deb with Sileo. Then force-close and reopen Messages.
          Configure switches in Settings > NOVA Messages.
          The tweak injects only into com.apple.MobileSMS.
          It uses iOS 12 UIKit blur, glass tint, ChatKit view matching and optional snowfall.
          ChatKit is private; the exact view hierarchy must be verified on the target device.
          To disable, turn off Enable NOVA Glass or uninstall the package from Sileo.
          EOF
          cd ../dist
          zip -r NOVA-Glass-Messages-iOS12.zip NOVA-Glass-Messages-iOS12
          shasum -a 256 NOVA-Glass-Messages-iOS12.zip > NOVA-Glass-Messages-iOS12.sha256

      - name: Build optional Lock Screen, Control Center and Phone experience
        run: |
          python3 tools/generate_ringtone.py
          ffmpeg -hide_banner -loglevel error -y -i dist/NOVA-Glass-Ringtone.wav -c:a aac -b:a 192k -t 30 -f ipod dist/NOVA-Glass-Ringtone.m4r
          mkdir -p NOVAExperience/layout/Library/Ringtones
          cp dist/NOVA-Glass-Ringtone.m4r "NOVAExperience/layout/Library/Ringtones/NOVA Glass.m4r"
          cd NOVAExperience
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean
          make package FINALPACKAGE=1
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.nova.glass.experience"
          test "$(dpkg-deb -f "$DEB" Version)" = "1.0.0"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          dpkg-deb -c "$DEB" | grep -F "Library/MobileSubstrate/DynamicLibraries/NOVAExperience.dylib"
          dpkg-deb -c "$DEB" | grep -F "Library/Ringtones/NOVA Glass.m4r"
          mkdir -p ../dist/NOVA-Glass-System-iOS12
          cp "$DEB" ../dist/NOVA-Glass-System-iOS12/
          cp README.md ../dist/NOVA-Glass-System-iOS12/
          cd ../dist
          zip -r NOVA-Glass-System-iOS12.zip NOVA-Glass-System-iOS12
          shasum -a 256 NOVA-Glass-System-iOS12.zip > NOVA-Glass-System-iOS12.sha256

      - name: Validate seasonal widget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("XenHTML/NOVA-Glass-Seasons/Wallpaper.html")
          s=p.read_text(encoding="utf-8")
          for token in ["spring","summer","autumn","winter","localStorage","Use automatic season","setInterval"]:
              assert token in s, "missing seasonal feature: "+token
          assert "com.apple.MobileSMS" not in s
          print("PASS: four seasons, automatic/manual selection and isolated Xen HTML widget.")
          PY

      - name: Generate complete borderless glass theme
        run: |
          python3 tools/build_theme.py
          python3 tools/build_complete_artwork.py
          python3 tools/build_seasonal_wallpapers.py
          mkdir -p dist/NOVA-Glass-Complete-iOS12
          cp -R "NOVA Glass.theme" dist/NOVA-Glass-Complete-iOS12/
          mkdir -p dist/NOVA-Glass-Complete-iOS12/Optional-XenHTML
          cp -R XenHTML/NOVA-Glass-Seasons dist/NOVA-Glass-Complete-iOS12/Optional-XenHTML/
          cp -R XenHTML/NOVA-LockScreen dist/NOVA-Glass-Complete-iOS12/Optional-XenHTML/
          cp dist/NOVA-Glass-Messages-iOS12/*.deb dist/NOVA-Glass-Complete-iOS12/ 2>/dev/null || true
          cp dist/NOVA-Glass-System-iOS12/*.deb dist/NOVA-Glass-Complete-iOS12/ 2>/dev/null || true
          cp dist/NOVA-Glass-Ringtone.m4r dist/NOVA-Glass-Complete-iOS12/
          cat > dist/NOVA-Glass-Complete-iOS12/INSTALL.txt <<'EOF'
          NOVA GLASS COMPLETE EDITION
          Target: iPhone 5s / iOS 12.5.8 / rootful Amethyst + SnowBoard
          Apply the icon theme in SnowBoard. Choose one of the included wallpapers.
          Optional seasonal animation: install compatible Xen HTML for iOS 12, then copy
          Optional-XenHTML/NOVA-Glass-Seasons to /var/mobile/Library/SBHTML/ and enable it.
          The widget supports automatic seasons and manual Spring/Summer/Autumn/Winter selection.
          Xen HTML is optional and is NOT installed by this theme. SnowBoard alone does not run HTML widgets.
          The Messages tweak .deb is separate and only injects into Apple Messages.
          NOVA Glass System Experience .deb is optional; it styles selected Lock Screen, Control Center and Phone UI surfaces.
          NOVA-Glass-Ringtone.m4r is an original ringtone; select it in Settings > Sounds.
          Optional-XenHTML/NOVA-LockScreen is a live clock/date widget; install a compatible Xen HTML release separately.
          Private iOS 12 UI class matching is best-effort and requires testing on the target iPhone.
          No SpringBoard tweak or Settings layout modification is included in the seasonal widget.
          EOF
          cd dist
          zip -r -0 NOVA-Glass-Complete-iOS12.zip NOVA-Glass-Complete-iOS12
          shasum -a 256 NOVA-Glass-Complete-iOS12.zip > NOVA-Glass-Complete-iOS12.sha256
          ls -lh NOVA-Glass-Complete-iOS12.zip

      - name: Upload complete theme and Messages package
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Complete-iOS12-v5
          path: |
            dist/NOVA-Glass-Complete-iOS12.zip
            dist/NOVA-Glass-Complete-iOS12.sha256
            dist/NOVA-Glass-Messages-iOS12.zip
            dist/NOVA-Glass-Messages-iOS12.sha256
            dist/NOVA-Glass-System-iOS12.zip
            dist/NOVA-Glass-System-iOS12.sha256
            dist/NOVA-Glass-Ringtone.m4r
          if-no-files-found: error
          retention-days: 30
