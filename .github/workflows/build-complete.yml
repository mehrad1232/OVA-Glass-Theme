name: Build NOVA Glass Complete iOS 12 Package

on:
  push:
    branches: [main]
    paths:
      - "NOVAWeather/**"
      - "NOVA Glass.theme/**"
      - "tools/**"
      - ".github/workflows/build-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-complete:
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg ffmpeg
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip Pillow

      - name: Generate SnowBoard theme and wallpapers
        run: |
          .venv/bin/python tools/build_theme.py
          .venv/bin/python tools/build_complete_artwork.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import plistlib
          from PIL import Image
          root=Path("NOVA Glass.theme")
          with (root/"Info.plist").open("rb") as f: info=plistlib.load(f)
          icons=list((root/"IconBundles").glob("*.png"))
          settings=list((root/"Bundles"/"com.apple.preferences-framework").glob("*.png"))
          walls=list((root/"Wallpapers").glob("*.png"))
          assert info.get("ThemeType")=="Icons" and info.get("PackageName")=="NOVA Glass"
          assert len(icons)>=70, f"Need at least 70 icon bundles, got {len(icons)}"
          assert len(settings)>=30, f"Need 2x/3x Settings icons, got {len(settings)}"
          assert len(walls)==6, f"Need six wallpapers, got {len(walls)}"
          for p in icons:
              with Image.open(p) as im: assert im.size==(120,120), p
          print(f"PASS: {len(icons)} app icons, {len(settings)} Settings assets, {len(walls)} wallpapers.")
          PY

      - name: Generate original NOVA ringtone
        run: |
          .venv/bin/python tools/generate_ringtone.py
          ffmpeg -hide_banner -loglevel error -y -i dist/NOVA-Glass-Ringtone.wav -t 24 -c:a aac -b:a 192k -f ipod dist/NOVA-Glass-Ringtone.m4r
          test -s dist/NOVA-Glass-Ringtone.m4r

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Stage all installable assets into the Debian package
        run: |
          mkdir -p "NOVAWeather/layout/Library/Ringtones"
          mkdir -p "NOVAWeather/layout/Library/Themes"
          cp dist/NOVA-Glass-Ringtone.m4r "NOVAWeather/layout/Library/Ringtones/NOVA Glass.m4r"
          cp -R "NOVA Glass.theme" "NOVAWeather/layout/Library/Themes/NOVA Glass.theme"

      - name: Compile rootful iOS 12 tweak
        working-directory: NOVAWeather
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean
          make package FINALPACKAGE=1
          test -n "$(find packages -name '*.deb' -maxdepth 1 -print -quit)"

      - name: Assemble one complete install bundle
        run: |
          mkdir -p dist/NOVA-Glass-Full
          cp -R "NOVA Glass.theme" dist/NOVA-Glass-Full/
          mkdir -p dist/NOVA-Glass-Full/Packages
          cp NOVAWeather/packages/*.deb dist/NOVA-Glass-Full/Packages/
          cp dist/NOVA-Glass-Ringtone.m4r dist/NOVA-Glass-Full/
          cp NOVAWeather/README.md dist/NOVA-Glass-Full/
          cat > dist/NOVA-Glass-Full/INSTALL.txt <<'EOF'
          NOVA GLASS — iPhone 5s / iOS 12.5.8 / rootful jailbreak

          1. Back up your device before installing.
          2. Install the single .deb in Packages/ using Sileo. It includes the theme, tweak, preference pane and ringtone.
          3. Enable NOVA Glass in SnowBoard and respring if needed.
          4. Select NOVA Glass in Settings > Sounds if iOS has registered the ringtone.

          The tweak uses private SpringBoard classes. Compilation is not proof of runtime safety.
          If SpringBoard enters a respring loop, remove com.nova.glass.weather from Sileo/SSH.
          The weather overlay is time-based: sunlight 07:00–13:59, snow 14:00–06:59.
          EOF
          cd dist
          zip -r -0 NOVA-Glass-Full-iOS12.zip NOVA-Glass-Full
          shasum -a 256 NOVA-Glass-Full-iOS12.zip > NOVA-Glass-Full-iOS12.sha256
          test -s NOVA-Glass-Full-iOS12.zip

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Full-iOS12
          path: |
            dist/NOVA-Glass-Full-iOS12.zip
            dist/NOVA-Glass-Full-iOS12.sha256
          if-no-files-found: error
          retention-days: 30
