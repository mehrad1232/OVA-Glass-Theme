name: Legacy Theme-Only Build (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image builder
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Generate theme
        run: python3 tools/build_theme.py
      - name: Package preview artifact
        run: |
          mkdir -p dist
          zip -r -0 dist/NOVA-Glass-Theme-Preview.zip "NOVA Glass.theme"
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Theme-Preview
          path: dist/NOVA-Glass-Theme-Preview.zip
