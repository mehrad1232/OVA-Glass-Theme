name: Build OVA Glass Theme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image builder
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Generate icons and wallpaper
        run: python3 tools/build_theme.py
      - name: Validate theme files and assets
        run: |
          test -f "NOVA Glass.theme/Info.plist"
          test -f "NOVA Glass.theme/Wallpaper.html"
          test -f "NOVA Glass.theme/Wallpaper-Preview.html"
          test -f "NOVA Glass.theme/README.md"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          from PIL import Image
          root = Path("NOVA Glass.theme")
          with (root / "Info.plist").open("rb") as f:
              plistlib.load(f)
          icons = list((root / "IconBundles").glob("*.png"))
          assert len(icons) >= 25, f"Expected >=25 icons, got {len(icons)}"
          for path in icons:
              with Image.open(path) as im:
                  assert im.format == "PNG" and im.size == (120, 120)
          for name in ("NOVA-Glass-Day-iPhone5s.png", "NOVA-Glass-Night-iPhone5s.png"):
              with Image.open(root / "Wallpapers" / name) as im:
                  assert im.format == "PNG" and im.size == (640, 1136)
          print(f"PASS: plist valid, {len(icons)} icons valid, wallpaper valid.")
          PY
      - name: Package theme
        run: |
          mkdir -p dist
          zip -r -0 "dist/NOVA-Glass-Theme-iOS12-v2.0.zip" "NOVA Glass.theme"
          SIZE=$(stat -c%s "dist/NOVA-Glass-Theme-iOS12-v2.0.zip")
          echo "Package size: $SIZE bytes"
          test "$SIZE" -ge 2000000
          sha256sum "dist/NOVA-Glass-Theme-iOS12-v2.0.zip" > "dist/SHA256SUMS.txt"
      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Glass-Theme-iOS12-v2.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
