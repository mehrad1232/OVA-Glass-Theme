<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NOVA Glass Atmosphere</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent!important;-webkit-user-select:none;user-select:none}
#nova-atmosphere{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none;z-index:999999}
#nova-atmosphere *{pointer-events:none}
#nova-fx-canvas{position:absolute;top:0;right:0;bottom:0;left:0;display:block;width:100%;height:100%;background:transparent}
#nova-sun-glow{position:absolute;left:-30vw;top:-30vh;width:105vw;height:105vw;max-width:620px;max-height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,245,208,.22) 0%,rgba(255,223,159,.13) 24%,rgba(255,208,139,.055) 47%,rgba(255,255,255,0) 72%);filter:blur(9px);opacity:.88;animation:novaSunPulse 13s ease-in-out infinite alternate}
.nova-sun-ray{position:absolute;left:8%;top:-29%;width:38vw;height:150vh;max-width:230px;background:linear-gradient(180deg,rgba(255,247,218,.16),rgba(255,234,190,.055) 46%,rgba(255,255,255,0) 88%);filter:blur(13px);transform-origin:top center;opacity:.58}
.nova-sun-ray.ray-a{transform:rotate(19deg);animation:novaRayA 22s ease-in-out infinite alternate}
.nova-sun-ray.ray-b{left:20%;width:26vw;opacity:.34;transform:rotate(31deg);animation:novaRayB 27s ease-in-out infinite alternate}
.nova-sun-ray.ray-c{left:-2%;width:22vw;opacity:.25;transform:rotate(9deg);animation:novaRayA 31s ease-in-out infinite alternate-reverse}
@keyframes novaSunPulse{from{opacity:.52;transform:scale(.92)}to{opacity:.96;transform:scale(1.08)}}
@keyframes novaRayA{from{margin-left:-4vw;opacity:.22}to{margin-left:9vw;opacity:.62}}
@keyframes novaRayB{from{margin-left:8vw;opacity:.16}to{margin-left:-3vw;opacity:.42}}
@media(prefers-reduced-motion:reduce){#nova-sun-glow,.nova-sun-ray{animation:none!important}}
</style>
</head>
<body>
<div id="nova-atmosphere" aria-hidden="true">
  <div id="nova-sun-glow"></div>
  <div class="nova-sun-ray ray-a"></div>
  <div class="nova-sun-ray ray-b"></div>
  <div class="nova-sun-ray ray-c"></div>
  <canvas id="nova-fx-canvas"></canvas>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("nova-fx-canvas");
if(!canvas||!canvas.getContext){return;}
var ctx=canvas.getContext("2d");
if(!ctx){return;}
var width=0,height=0,ratio=1,lastFrame=0,rafId=0;
var flakes=[],drops=[],leaves=[];
var TAU=Math.PI*2;
var random=function(a,b){return a+Math.random()*(b-a);};
function resize(){
  width=Math.max(1,window.innerWidth||document.documentElement.clientWidth||320);
  height=Math.max(1,window.innerHeight||document.documentElement.clientHeight||568);
  ratio=Math.min(1.35,window.devicePixelRatio||1);
  canvas.width=Math.round(width*ratio);
  canvas.height=Math.round(height*ratio);
  canvas.style.width=width+"px";
  canvas.style.height=height+"px";
  ctx.setTransform(ratio,0,0,ratio,0,0);
  var scale=Math.min(1.35,Math.max(.8,Math.sqrt((width*height)/(320*568))));
  makeSnow(Math.round(24*scale));
  makeRain(Math.round(18*scale));
  makeLeaves(Math.round(7*scale));
}
function makeSnow(count){
  flakes=[];
  for(var i=0;i<count;i++){
    flakes.push({x:random(0,width),y:random(-height,height),r:random(.7,2.15),v:random(13,31),s:random(5,17),p:random(0,TAU),a:random(.35,.84)});
  }
}
function makeRain(count){
  drops=[];
  for(var i=0;i<count;i++){
    drops.push({x:random(-20,width+20),y:random(-height,height),len:random(8,17),v:random(205,330),w:random(-24,22),a:random(.16,.46),line:random(.65,1.2)});
  }
}
function makeLeaves(count){
  leaves=[];
  for(var i=0;i<count;i++){
    leaves.push({x:random(-20,width+20),y:random(-height,height),size:random(5.5,10.5),v:random(20,43),wind:random(9,25),phase:random(0,TAU),angle:random(0,TAU),spin:random(-1.5,1.8),hue:random(18,39),alpha:random(.5,.9)});
  }
}
function resetFlake(f){f.x=random(0,width);f.y=-8;f.v=random(13,31);f.r=random(.7,2.15);}
function resetDrop(d){d.x=random(-12,width+12);d.y=-22;d.v=random(205,330);}
function resetLeaf(l){l.x=random(-15,width+15);l.y=-24;l.v=random(20,43);l.phase=random(0,TAU);}
function drawSnow(dt,time){
  ctx.save();
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i];
    f.y+=f.v*dt;
    f.x+=(Math.sin(time*.0007+f.p)*f.s+5)*dt;
    if(f.y>height+8||f.x>width+12){resetFlake(f);}
    ctx.globalAlpha=f.a;
    ctx.fillStyle="#f5fbff";
    ctx.shadowColor="rgba(224,244,255,.72)";
    ctx.shadowBlur=2.5;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawRain(dt){
  ctx.save();
  ctx.lineCap="round";
  for(var i=0;i<drops.length;i++){
    var d=drops[i];
    d.y+=d.v*dt;
    d.x+=d.w*dt;
    if(d.y>height+25||d.x>width+25||d.x<-25){resetDrop(d);}
    ctx.globalAlpha=d.a;
    ctx.strokeStyle="rgba(190,222,255,.88)";
    ctx.lineWidth=d.line;
    ctx.beginPath();
    ctx.moveTo(d.x,d.y);
    ctx.lineTo(d.x-2.2,d.y+d.len);
    ctx.stroke();
  }
  ctx.restore();
}
function drawLeaf(l){
  var s=l.size;
  ctx.save();
  ctx.translate(l.x,l.y);
  ctx.rotate(l.angle);
  ctx.scale(s/9,s/9);
  ctx.beginPath();
  ctx.moveTo(-9,0);
  ctx.bezierCurveTo(-5,-8,5,-8,10,0);
  ctx.bezierCurveTo(5,8,-5,8,-9,0);
  ctx.closePath();
  ctx.fillStyle="hsla("+l.hue+",78%,58%,"+l.alpha+")";
  ctx.fill();
  ctx.strokeStyle="rgba(104,54,24,.62)";
  ctx.lineWidth=.7;
  ctx.beginPath();
  ctx.moveTo(-8,0);
  ctx.quadraticCurveTo(0,1,9,0);
  ctx.stroke();
  ctx.restore();
}
function drawLeaves(dt,time){
  for(var i=0;i<leaves.length;i++){
    var l=leaves[i];
    l.y+=l.v*dt;
    l.x+=(Math.sin(time*.001+l.phase)*l.wind+7)*dt;
    l.angle+=l.spin*dt;
    if(l.y>height+30||l.x>width+35||l.x<-35){resetLeaf(l);}
    drawLeaf(l);
  }
}
function frame(time){
  rafId=window.requestAnimationFrame(frame);
  if(document.hidden){lastFrame=time;return;}
  if(time-lastFrame<32){return;}
  var dt=lastFrame?Math.min(.05,(time-lastFrame)/1000):.033;
  lastFrame=time;
  ctx.clearRect(0,0,width,height);
  drawSnow(dt,time);
  drawRain(dt);
  drawLeaves(dt,time);
}
window.addEventListener("resize",resize,false);
document.addEventListener("visibilitychange",function(){lastFrame=0;},false);
resize();
if(!rafId){rafId=window.requestAnimationFrame(frame);}
})();
</script>
</body>
</html>
