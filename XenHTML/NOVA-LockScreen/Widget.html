<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NOVA Glass Lock Screen</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
#nova{position:absolute;top:11%;left:7%;right:7%;text-align:center;text-shadow:0 2px 18px #00172f99}
#time{font-size:clamp(66px,19vw,104px);font-weight:200;letter-spacing:-5px;line-height:1}
#date{margin-top:12px;font-size:17px;font-weight:500;letter-spacing:.3px;color:#f0f8ff}
.panel{margin:28px auto 0;padding:13px 18px;max-width:310px;border:1px solid #ffffff55;border-radius:22px;background:linear-gradient(135deg,#ffffff35,#a8d9ff16);box-shadow:0 12px 38px #001b3870,inset 0 1px #ffffff45;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#caption{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#d8efff}
#season{margin-top:5px;font-size:15px;font-weight:500}
.flake{position:absolute;top:-12px;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8;box-shadow:0 0 8px #fff;animation:drift linear infinite}
@keyframes drift{to{transform:translate3d(18px,110vh,0);opacity:.05}}
</style>
</head>
<body>
<div id="nova"><div id="time">09:41</div><div id="date"></div><div class="panel"><div id="caption">N O V A  G L A S S</div><div id="season">Frosted • Calm • Clear</div></div></div>
<script>
(function(){
 const time=document.getElementById('time'),date=document.getElementById('date'),season=document.getElementById('season');
 function update(){const d=new Date();time.textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});date.textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});const m=d.getMonth();season.textContent=m<2||m===11?'Winter glass':m<5?'Spring bloom':m<8?'Summer light':'Autumn glow';}
 update();setInterval(update,1000);
 for(let i=0;i<18;i++){const f=document.createElement('i');f.className='flake';f.style.left=(Math.random()*100)+'%';f.style.animationDuration=(9+Math.random()*14)+'s';f.style.animationDelay=(-Math.random()*18)+'s';f.style.opacity=(.2+Math.random()*.55);document.body.appendChild(f);}
})();
</script>
</body></html>
